name: CD

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: site-monitor
            file: Dockerfile
          - image: site-monitor-gateway
            file: Dockerfile.gateway
          - image: site-monitor-notification
            file: Dockerfile.notification
          - image: site-monitor-migrate
            file: Dockerfile.migrate
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          repository: ViktorNikolaevichD/site-monitor
          path: app
      - name: Image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app
          file: app/${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout chart
        uses: actions/checkout@v7
      - name: Image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install kind, Helm, kubectl
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Load images into kind
        env:
          OWNER: ${{ steps.owner.outputs.name }}
          TAG: ${{ github.sha }}
        run: |
          images="site-monitor site-monitor-gateway site-monitor-notification site-monitor-migrate"
          for image in $images; do
            docker pull "ghcr.io/${OWNER}/${image}:${TAG}"
          done
          kind create cluster --name site-monitor
          for image in $images; do
            kind load docker-image "ghcr.io/${OWNER}/${image}:${TAG}" --name site-monitor
          done
      - name: Deploy
        id: deploy
        env:
          OWNER: ${{ steps.owner.outputs.name }}
          TAG: ${{ github.sha }}
          VALUES: ${{ github.ref_name == 'main' && 'helm/monitor-service/values-prod.yaml' || 'helm/monitor-service/values-dev.yaml' }}
        run: |
          helm upgrade --install monitor helm/monitor-service \
            --namespace site-monitor \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 15m \
            -f "${VALUES}" \
            --set monitor.image.repository="ghcr.io/${OWNER}/site-monitor" \
            --set monitor.image.tag="${TAG}" \
            --set monitor.image.pullPolicy=IfNotPresent \
            --set gateway.image.repository="ghcr.io/${OWNER}/site-monitor-gateway" \
            --set gateway.image.tag="${TAG}" \
            --set gateway.image.pullPolicy=IfNotPresent \
            --set notification.image.repository="ghcr.io/${OWNER}/site-monitor-notification" \
            --set notification.image.tag="${TAG}" \
            --set notification.image.pullPolicy=IfNotPresent \
            --set migrate.image.repository="ghcr.io/${OWNER}/site-monitor-migrate" \
            --set migrate.image.tag="${TAG}" \
            --set migrate.image.pullPolicy=IfNotPresent
      - name: Smoke test
        run: |
          kubectl -n site-monitor run smoke \
            --restart=Never \
            --image=curlimages/curl:8.17.0 \
            --command -- curl -fsS http://gateway.site-monitor.svc.cluster.local:8082/health
          kubectl -n site-monitor wait --for=jsonpath='{.status.phase}'=Succeeded pod/smoke --timeout=90s
          kubectl -n site-monitor logs pod/smoke
      - name: Rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          rev=$(helm history monitor --namespace site-monitor -o json | jq 'length')
          if [ "$rev" -gt 1 ]; then
            helm rollback monitor --namespace site-monitor --wait --timeout 10m
          fi
