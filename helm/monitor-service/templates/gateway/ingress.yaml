{{- if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-service.labels" (dict "component" "gateway" "root" .) | nindent 4 }}
  annotations:
    site-monitor/description: "Внешний HTTP-вход к gateway"
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: {{ .Values.gateway.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
{{- end }}
