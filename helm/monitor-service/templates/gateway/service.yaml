apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-service.labels" (dict "component" "gateway" "root" .) | nindent 4 }}
spec:
  selector:
    {{- include "monitor-service.selectorLabels" (dict "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
