apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-service.labels" (dict "component" "monitor" "root" .) | nindent 4 }}
  annotations:
    site-monitor/description: "Проверки сайтов, REST и gRPC, запись в PostgreSQL, события в Kafka"
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.monitor.replicaCount }}
  selector:
    matchLabels:
      {{- include "monitor-service.selectorLabels" (dict "component" "monitor") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "monitor-service.labels" (dict "component" "monitor" "root" .) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: "{{ .Values.monitor.image.repository }}:{{ .Values.monitor.image.tag }}"
          imagePullPolicy: {{ .Values.monitor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.monitor.ports.http }}
            - name: grpc
              containerPort: {{ .Values.monitor.ports.grpc }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monitor
                  key: DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /configs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.monitor.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: monitor
