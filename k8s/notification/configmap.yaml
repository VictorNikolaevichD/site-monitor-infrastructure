apiVersion: v1
kind: ConfigMap
metadata:
  name: notification
  namespace: site-monitor
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: site-monitor
data:
  KAFKA_BROKER: "kafka:9092"
  KAFKA_TOPIC: "site-check-events"
  KAFKA_GROUP_ID: "notification-service"
  KAFKA_DLQ_TOPIC: "site-check-events-dlq"
  NOTIFICATION_HTTP_ADDR: ":8081"
  NOTIFICATION_LOG_LEVEL: "info"
  NOTIFICATION_RETRY_ENABLED: "true"
  NOTIFICATION_RETRY_MAX_ATTEMPTS: "3"
  NOTIFICATION_RETRY_INTERVAL: "1s"
  NOTIFICATION_RETRY_MULTIPLIER: "2"
