apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: site-monitor
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: site-monitor
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
