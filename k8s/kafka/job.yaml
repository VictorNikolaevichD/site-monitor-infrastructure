apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: site-monitor
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/part-of: site-monitor
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/part-of: site-monitor
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-topics
          image: apache/kafka:4.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64M -Xmx128M"
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092; do
                echo "waiting for kafka"
                sleep 2
              done
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic site-check-events \
                --partitions 1 \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic site-check-events-dlq \
                --partitions 1 \
                --replication-factor 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
