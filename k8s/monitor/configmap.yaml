apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor
  namespace: site-monitor
  labels:
    app.kubernetes.io/name: monitor
    app.kubernetes.io/part-of: site-monitor
data:
  config.yaml: |
    interval: 60s
    http_addr: :8080
    grpc_addr: :9090
    log_level: info
    http_timeout: 10s
    database:
      max_conns: 10
      min_conns: 2
      max_conn_lifetime: 1h
      max_conn_idle_time: 30m
      connect_timeout: 5s
      query_timeout: 3s
    kafka:
      broker: kafka:9092
      topic: site-check-events
